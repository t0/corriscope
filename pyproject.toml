[build-system]
    requires = [
        "setuptools>=64,<82", # >=64 required for setuptools-scm
        "setuptools-scm>=8.0", # automatically manages version number from git
        "wheel"
        ]
    build-backend = "setuptools.build_meta"

[project]
    name = "corriscope"
    description = "Controls t0.technology CRS boards running the chFPGA FX-correlator firmware (corr8 / corr32 / corr64)"
    classifiers= [
        "Programming Language :: Python :: 3",
        "Operating System :: OS Independent",
        "Topic :: Scientific/Engineering :: Astronomy",
        "Intended Audience :: Science/Research",
        ]
    dynamic=["version"]
    # Forked from pychfpga by JF Cliche (McGill University / Winterland Cosmology):
    # https://bitbucket.org/winterlandcosmology/pychfpga
    authors = [
        { name = "t0.technology" },
        ]
    requires-python = "==3.12.*"
    readme = "README.md"

    dependencies = [
        "setuptools>=64,<82", # required by setuptools-scm
        "setuptools-scm>=8.0",

        # PyPI packages only: the former private wtl.* helpers are re-implemented in corriscope/common
        "aiohttp",  # CRS discovery / netconsole firmware loading / REST
        "numpy",
        "h5py",  # pocket_correlator and raw_acq data files
        "matplotlib",
        "PyYAML",
        "psutil",  # fpga_master system metrics
        "ifaddr",  # CRS beacon discovery
        "xmodem",  # CRS U-Boot netconsole firmware upload
        "zeroconf==0.34.3",  # mDNS discovery
        ]

# also needed for the jupyter notebooks in tests/: jupyter, ipympl

[project.scripts]
    fpga_master = "corriscope.fpga_master:main"
    raw_acq = "corriscope.raw_acq.__main__:main"
    corriscope_gps = "corriscope.gps:main"

[project.urls]
    Repository = "https://github.com/t0/corriscope"

[tool.setuptools.package-data]
    corriscope = ["*.bit", "*.yaml", "*.elf", "*.bin", "*.txt"]

[tool.setuptools.packages.find]
    where = ["."]
    exclude = ["tests", "tests.*"]
    namespaces = false

[tool.setuptools_scm]
    version_file = "corriscope/_version_scm.py"

[project.optional-dependencies]
    test = [
        "pytest>=8,<9",
        ]

[tool.pytest.ini_options]
    testpaths = ["tests"]
    # tests/crs_corr_tests holds notebooks and scripts that need real CRS hardware; not collected by pytest.
    norecursedirs = ["crs_corr_tests", ".*", "__pycache__"]
